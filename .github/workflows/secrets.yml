name: Secrets

# gitleaks over the whole git history (every branch and tag), with the
# default rules plus OmniSync's own and the reviewed allow-list in
# .gitleaks.toml. On every push to any branch, so a secret is reported as
# soon as it reaches GitHub (rotate it then: removing it from the history
# does not un-leak it), on pull requests, and on demand. The same rules run
# locally in the pre-commit hook (.pre-commit-config.yaml) and, for the
# tracked files, in backend/tests/test_repo_secrets.py.
#
# The gitleaks release binary is pinned by version and SHA-256 (no action
# that could move under a tag, no Node runtime, no licence key). Findings are
# printed redacted. Runners: as in ci.yml.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every commit of every branch and tag
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version
      - name: gitleaks
        run: >-
          "$RUNNER_TEMP/bin/gitleaks" git
          --config .gitleaks.toml
          --log-opts=--all
          --redact
          --no-banner
          --verbose
          .
