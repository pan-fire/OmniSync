# Alembic configuration for the OmniSync database.
#
# The app applies migrations itself at startup (backend.db.database.
# init_database), so this file is only for developers, run from the repo root:
#
#   alembic -c backend/alembic.ini current
#   alembic -c backend/alembic.ini revision --autogenerate -m "add foo column"
#   alembic -c backend/alembic.ini upgrade head
#
# The database is the one OMNISYNC_DB_PATH names (default
# /data/omnisync/omnisync.db); pass -x db=/path/to/omnisync.db to override.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
