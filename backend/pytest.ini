[pytest]
asyncio_mode = auto
testpaths = tests
# The suite runs warning-free: a new warning fails it. Ignore only
# third-party noise here, each with the reason.
filterwarnings =
    error
# Scale tests (minutes, not seconds) run only when asked for: pytest -m slow.
# CI runs them in a step of their own.
markers =
    slow: scale tests deselected by default; run with -m slow
addopts = -m "not slow"
