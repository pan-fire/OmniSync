# Local hooks that stop a secret or a stray big file before it is
# committed. Install once per clone (https://pre-commit.com):
#
#   pip install pre-commit && pre-commit install
#
# CI runs the same gitleaks rules (.gitleaks.toml) over the whole history
# (.github/workflows/secrets.yml), and backend/tests/test_repo_secrets.py
# checks the tracked files with OmniSync's own rules, so skipping the hooks
# only moves the failure later. Revisions are pinned to commits, with the
# release in a comment; `pre-commit autoupdate --freeze` updates both.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Scans the staged changes with .gitleaks.toml (found at the root).
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
